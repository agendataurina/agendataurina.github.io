<style>
:root{--rojo:#FF3333;--rojo2:#B71C1C;--ubi:#CC3333;--fondo:#F2F2F2;--txt:#222;--gris:#777;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--fondo);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--rojo2);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:22px;padding:2px 6px;cursor:pointer}
nav{position:sticky;top:50px;z-index:4;display:flex;background:#fff;border-bottom:1px solid #ddd}
nav a{flex:1;text-align:center;padding:10px 2px;font-size:12px;font-weight:600;color:var(--gris);text-decoration:none;border-bottom:3px solid transparent}
nav a.on{color:var(--rojo2);border-color:var(--rojo2)}
main{max-width:640px;margin:0 auto;padding:12px 12px 80px}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);margin:0 0 14px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 14px}
.card .hd img.logo{width:42px;height:42px;object-fit:contain}
.card h2{font-size:18px;margin:0}.card h3{font-size:14px;margin:2px 0 0;color:var(--gris);font-weight:600}
.card .d{padding:0 14px 14px;white-space:pre-wrap;line-height:1.45;font-size:15px}
.card img.main{width:100%;display:block}
.btns{padding:0 12px 12px}
.btn{display:block;background:var(--rojo);color:#fff;text-decoration:none;font-weight:700;padding:13px 14px;border-radius:8px;margin:8px 0;font-size:15px}
.btn.ubi{background:var(--ubi);color:#eee;text-align:center}
.fotos{display:flex;gap:10px;overflow-x:auto;padding:0 12px 14px;scroll-snap-type:x mandatory}
.fotos figure{margin:0;flex:0 0 78%;scroll-snap-align:start;text-align:center}
.fotos img{width:100%;border-radius:8px;display:block}.fotos figcaption{font-size:13px;font-weight:700;margin-top:4px}
.prov{margin:10px 0 4px;font-size:13px;font-weight:800;color:var(--rojo2);letter-spacing:.5px;display:flex;justify-content:space-between}
.mes{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);margin-bottom:14px}
.mes h2{text-align:center;font-size:17px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid b{font-size:11px;color:var(--gris)}
.grid a,.grid span{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;text-decoration:none;color:#bbb}
.grid a{background:var(--rojo);color:#fff;font-weight:700}.grid a i{font-style:normal;font-size:10px;font-weight:400}
.grid a.hoy{outline:3px solid #222}
.aviso{background:#FFF3CD;border:1px solid #F0D27A;border-radius:10px;padding:12px;margin-bottom:14px;font-size:14px}
.aviso a{color:var(--rojo2);font-weight:700}
.search{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px;margin-bottom:12px}
.tile{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;text-decoration:none;color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tile img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#eee}.tile span{font-weight:700;font-size:15px}.tile small{display:block;color:var(--gris);font-weight:400}
.vacio{color:var(--gris);text-align:center;padding:30px 10px}
.susp{border:2px solid var(--rojo)}
</style></head>

function vBous(){setNav('');titulo('Ver bous al carrer');setTimeout(()=>{window.__bf=function(j){const e=(j.feed&&j.feed.entry)||[];document.getElementById('bf').innerHTML=e.map(x=>{const l=(x.link||[]).find(k=>k.rel==='alternate');const img=x.media$thumbnail?x.media$thumbnail.url.replace('/s72-c/','/s400/'):'';return '<a class="card" style="display:block;text-decoration:none;color:inherit" target="_blank" rel="noopener" href="'+(l?l.href:'#')+'">'+(img?'<img class="main" src="'+img+'">':'')+'<div class="hd"><h2 style="font-size:16px">'+esc(x.title.$t)+'</h2></div></a>';}).join('')||'<div class="vacio">Sin noticias.</div>';};const s=document.createElement('script');s.src='https://torodigital.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=15&callback=__bf';s.onerror=()=>{document.getElementById('bf').innerHTML='<div class="vacio">No se pudieron cargar. <a href="https://torodigital.blogspot.com/" target="_blank">Abrir la web</a></div>';};document.body.appendChild(s);},0);return '<div id="bf"><div class="vacio">Cargando noticias…</div></div>';}
function route(){const h=decodeURIComponent(location.hash.slice(1));let html;
 if(!h||h==='hoy')html=vHoy();else if(h==='calendario')html=vCal();else if(h==='provincias')html=vProvs();else if(h.startsWith('buscar'))html=vBus();else if(h==='mas')html=vMas();else if(h==='tv')html=vTv();else if(h==='bous')html=vBous();
 else if(h.startsWith('d/'))html=vDia(h.slice(2));else if(h.startsWith('pr/'))html=vProv(h.slice(3));else if(h.startsWith('p/'))html=vPueblo(h.slice(2));else html=vHoy();
 document.getElementById('app').innerHTML=html;window.scrollTo(0,0);}
addEventListener('hashchange',route);route();
</script></body></html>
